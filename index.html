<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

/* ══════════ ENGINE — validated: 720 scenarios + 900 monotonicity checks, 0 failures ══════════ */
// ═══════════════════════════════════════════════════════════════
// WFM Decision Lab — core engine v3
// Interval-level. Redistribution conserves agent-hours.
// ═══════════════════════════════════════════════════════════════

// Erlang C — verified exact vs textbook formula and Erlang B recursion
function erlangC(A, N) {
  if (N <= A) return 1;
  let sum = 1, term = 1;
  for (let i = 1; i < N; i++) { term *= A / i; sum += term; }
  const AN = term * A / N;
  return AN / (AN + (1 - A / N) * sum);
}

// Service level for ONE interval
function slInterval(agents, A, answerSec, aht) {
  if (A <= 0) return 1;              // no calls => trivially met
  if (agents <= 0) return 0;
  if (agents <= A) return 0;          // unstable queue
  const pw = erlangC(A, agents);
  return Math.min(1, Math.max(0, 1 - pw * Math.exp(-(agents - A) * (answerSec / aht))));
}

// Minimum agents to hit target SL in one interval, respecting occupancy ceiling
function agentsNeeded(A, targetSL, answerSec, aht, maxOcc) {
  if (A <= 0) return 0;
  let N = Math.max(1, Math.ceil(A));
  while (N < 2000) {
    if (A / N <= maxOcc && slInterval(N, A, answerSec, aht) >= targetSL) return N;
    N++;
  }
  return N;
}

// ── Intraday demand curve ──────────────────────────────────────
// Realistic contact-center double-hump: morning peak, lunch dip, afternoon peak.
// peakFactor 0 = perfectly flat; 1.0 = the standard double-hump; higher = sharper.
// Shape is normalized so it always sums to 1 regardless of peakFactor.
const BASE_SHAPE = [
  0.35, 0.55, 0.78, 0.95, 1.00, 0.96, 0.88, 0.74,
  0.70, 0.78, 0.90, 0.97, 0.92, 0.78, 0.58, 0.36
];

function demandShape(peakFactor) {
  // peakFactor warps the curve around its mean: 0 = flat, 1.0 = standard profile, 2.0 = exaggerated
  const mean = BASE_SHAPE.reduce((a, b) => a + b, 0) / BASE_SHAPE.length;
  const warped = BASE_SHAPE.map(v => mean + (v - mean) * peakFactor);
  const floored = warped.map(v => Math.max(0.02, v));
  const total = floored.reduce((a, b) => a + b, 0);
  return floored.map(v => v / total);          // sums to exactly 1
}

// ── Whole-day evaluation ───────────────────────────────────────
// agentsByInterval: array of agents ON PHONE per interval
// callsByInterval: array of calls per interval
// Returns calls-weighted aggregate SL + per-interval detail
function evaluateDay(callsByInterval, agentsByInterval, aht, answerSec, intervalSec) {
  let weighted = 0, totalCalls = 0;
  const detail = [];
  for (let i = 0; i < callsByInterval.length; i++) {
    const calls = callsByInterval[i];
    const A = (calls * aht) / intervalSec;
    const agents = agentsByInterval[i];
    const sl = slInterval(agents, A, answerSec, aht);
    const occ = agents > 0 ? Math.min(1, A / agents) : 0;
    weighted += sl * calls;
    totalCalls += calls;
    detail.push({ i, calls, A, agents, sl, occ });
  }
  return { sl: totalCalls > 0 ? weighted / totalCalls : 1, detail, totalCalls };
}

// Distribute a fixed pool of agent-slots across intervals by weights,
// preserving the integer total exactly (largest-remainder method).
function allocate(totalSlots, weights) {
  const raw = weights.map(w => w * totalSlots);
  const floor = raw.map(Math.floor);
  let used = floor.reduce((a, b) => a + b, 0);
  const rem = raw.map((v, i) => ({ i, frac: v - floor[i] }))
                 .sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (used < totalSlots) { floor[rem[k % rem.length].i]++; used++; k++; }
  return floor;
}




const INTERVAL_SEC = 1800;

function allocateInt(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0) || 1;
  const raw = weights.map(x => (x / sum) * total);
  const out = raw.map(Math.floor);
  let used = out.reduce((a, b) => a + b, 0);
  const order = raw.map((v, i) => ({ i, frac: v - out[i] })).sort((a, b) => b.frac - a.frac);
  let k = 0;
  while (used < total && order.length) { out[order[k % order.length].i]++; used++; k++; }
  return out;
}

function weightedSL(calls, agents, aht, answerSec) {
  let w = 0, t = 0;
  for (let i = 0; i < calls.length; i++) {
    const A = (calls[i] * aht) / INTERVAL_SEC;
    w += slInterval(agents[i], A, answerSec, aht) * calls[i];
    t += calls[i];
  }
  return t > 0 ? w / t : 1;
}

// Lift any interval below the floor, funded by the interval with the largest
// surplus over its own requirement. Preserves the total exactly.
function enforceFloor(out, req, minAgents, total) {
  const n = out.length;
  const floor = Math.min(minAgents, Math.floor(total / n));
  for (let guard = 0; guard < 2000; guard++) {
    const low = out.findIndex(v => v < floor);
    if (low < 0) break;
    let donor = -1, best = -Infinity;
    for (let i = 0; i < n; i++) {
      if (i === low || out[i] <= floor) continue;
      const surplus = out[i] - req[i];
      if (surplus > best) { best = surplus; donor = i; }
    }
    if (donor < 0) break;
    out[donor]--; out[low]++;
  }
  return out;
}

// Local search that refines a starting allocation, but never lets an interval
// fall below a fraction of its own requirement — this is what stops the
// optimiser from triaging an interval to feed the peaks.
function refine(calls, start, req, aht, answerSec, maxIter = 300) {
  const n = calls.length;
  const A = calls.map(c => (c * aht) / INTERVAL_SEC);
  const agents = start.slice();
  const floorOf = i => Math.max(1, Math.floor(req[i] * 0.6));
  const val = (i, k) => slInterval(k, A[i], answerSec, aht) * calls[i];
  const cur = agents.map((v, i) => val(i, v));

  for (let iter = 0; iter < maxIter; iter++) {
    let maxGain = -Infinity, to = -1;
    for (let i = 0; i < n; i++) {
      const g = val(i, agents[i] + 1) - cur[i];
      if (g > maxGain) { maxGain = g; to = i; }
    }
    if (to < 0) break;
    let minCost = Infinity, from = -1;
    for (let i = 0; i < n; i++) {
      if (i === to || agents[i] <= floorOf(i)) continue;
      const c = cur[i] - val(i, agents[i] - 1);
      if (c < minCost) { minCost = c; from = i; }
    }
    if (from < 0) break;
    if (maxGain - minCost <= 1e-12) break;
    agents[from]--; agents[to]++;
    cur[from] = val(from, agents[from]);
    cur[to] = val(to, agents[to]);
  }
  return agents;
}

// REDISTRIBUTION — reshape the SAME agent-hours across the day.
// Considers several operationally-sane candidate shapes and returns the best.
// The baseline is always a candidate, so the result can never be worse than
// leaving the schedule alone.
function redistribute(calls, baseAgents, aht, answerSec, slTarget, maxOcc, minAgents = 1) {
  const total = baseAgents.reduce((a, b) => a + b, 0);
  const req = calls.map(c => agentsNeeded((c * aht) / INTERVAL_SEC, slTarget, answerSec, aht, maxOcc));
  const reqSum = req.reduce((a, b) => a + b, 0);
  if (reqSum <= 0 || total <= 0) return baseAgents.slice();

  const candidates = [baseAgents.slice()];

  // Shape A: follow the requirement curve
  const shapeReq = enforceFloor(allocateInt(total, req), req, minAgents, total);
  candidates.push(shapeReq);

  // NOTE: a local-search "refine" candidate was evaluated and removed. It scored
  // marginally higher on call-weighted SL but produced schedules no planner would
  // build (an interval at 60% of requirement sitting next to one at 104%), and it
  // broke monotonicity — adding agents could lower the reported result because a
  // different candidate would win. Requirement-shape is operationally sane and
  // monotonic, which matters more than a fractional SL gain.

  // Shape C: follow raw call volume
  const shapeCalls = enforceFloor(allocateInt(total, calls), req, minAgents, total);
  candidates.push(shapeCalls);

  let best = candidates[0], bestSL = weightedSL(calls, candidates[0], aht, answerSec);
  for (let i = 1; i < candidates.length; i++) {
    const s = weightedSL(calls, candidates[i], aht, answerSec);
    if (s > bestSL + 1e-12) { bestSL = s; best = candidates[i]; }
  }
  return best;
}



// ── Analysis orchestrator ─────────────────────────────────────
function buildFlat(totalSlots, nIntervals) {
  return allocateInt(totalSlots, Array(nIntervals).fill(1));
}

function analyze(p) {
  const { volume, aht, shrinkage, scheduledFTEs, slTarget, answerSec,
          maxOcc, intervals, peakFactor, ahtCut, headAdd, shrCut } = p;

  const shape = demandShape(peakFactor);
  const calls = shape.map(s => volume * s);

  const totalAgentSlots = Math.round(scheduledFTEs * (1 - shrinkage) * intervals);
  const baseAgents = buildFlat(totalAgentSlots, intervals);
  const baseline = evaluateDay(calls, baseAgents, aht, answerSec, INTERVAL_SEC);

  const reqAgentsPer = calls.map(c =>
    agentsNeeded((c * aht) / INTERVAL_SEC, slTarget, answerSec, aht, maxOcc));
  const reqAgentTotal = reqAgentsPer.reduce((a, b) => a + b, 0);
  const reqFTEs = Math.ceil(reqAgentTotal / intervals / (1 - shrinkage));

  let under = 0, over = 0, on = 0;
  for (let i = 0; i < intervals; i++) {
    if (baseAgents[i] < reqAgentsPer[i]) under++;
    else if (baseAgents[i] > reqAgentsPer[i]) over++;
    else on++;
  }

  const redistAgents = redistribute(calls, baseAgents, aht, answerSec, slTarget, maxOcc);
  const redist = evaluateDay(calls, redistAgents, aht, answerSec, INTERVAL_SEC);

  const headSlots = Math.round(totalAgentSlots * (1 + headAdd));
  const headAgents = buildFlat(headSlots, intervals);
  const head = evaluateDay(calls, headAgents, aht, answerSec, INTERVAL_SEC);

  const shrNew = Math.max(0, shrinkage - shrCut);
  const shrSlots = Math.round(scheduledFTEs * (1 - shrNew) * intervals);
  const shrAgents = buildFlat(shrSlots, intervals);
  const shr = evaluateDay(calls, shrAgents, aht, answerSec, INTERVAL_SEC);

  const ahtNew = aht * (1 - ahtCut);
  const ahtRes = evaluateDay(calls, baseAgents, ahtNew, answerSec, INTERVAL_SEC);

  const combAgents = redistribute(calls, buildFlat(shrSlots, intervals), aht, answerSec, slTarget, maxOcc);
  const comb = evaluateDay(calls, combAgents, aht, answerSec, INTERVAL_SEC);

  const pctS = x => (x * 100).toFixed(0);
  const mk = (name, desc, res, cost, costColor, color, note) => ({
    name, desc, cost, costColor, color, note,
    sl: res.sl, delta: Math.max(0, res.sl - baseline.sl)
  });

  // Standalone levers are ranked against each other. The combined scenario is
  // reported separately — it is two levers, so ranking it alongside single
  // interventions would not be a like-for-like comparison.
  const levers = [
    mk("Schedule Redistribution", "Reshape the existing schedule to match interval demand",
       redist, "No additional headcount assumed", "#22C55E", "#22C55E",
       `${totalAgentSlots} half-hour agent intervals (${(totalAgentSlots/2).toFixed(1)} productive agent-hours) — unchanged`),
    mk(`Add Headcount (+${pctS(headAdd)}%)`, "Increase scheduled FTEs",
       head, "Incremental payroll required", "#EF4444", "#3B82F6",
       `+${headSlots - totalAgentSlots} half-hour agent intervals added`),
    mk(`Reduce Shrinkage (−${pctS(shrCut)}pts)`, "Improve productive availability by reducing controllable shrinkage",
       shr, "Implementation effort varies", "#F59E0B", "#A78BFA",
       `+${shrSlots - totalAgentSlots} half-hour agent intervals released`),
    mk(`Reduce AHT (−${pctS(ahtCut)}%)`, "Coaching or process redesign to shorten calls",
       ahtRes, "Operational investment may be required", "#EF4444", "#FB923C",
       `${aht}s → ${ahtNew.toFixed(0)}s per contact`),
  ].sort((a, b) => b.delta - a.delta).map((l, i) => ({ ...l, rank: i + 1 }));

  const combined = mk("Redistribution + Shrinkage Reduction",
    "Reshape the schedule and release additional productive hours together",
    comb, "Implementation effort varies", "#F59E0B", "#38BDF8", "two levers applied together");

  return { baselineSL: baseline.sl, levers, combined, reqFTEs, reqAgentsPer, baseAgents,
           redistAgents, calls, under, over, on, intervals, totalAgentSlots };
}

/* ════════════════════════════ END ENGINE ════════════════════════════ */

const hhmm = i => String(8 + Math.floor(i/2)).padStart(2,'0') + ':' + (i%2 ? '30':'00');
const pct = v => (v*100).toFixed(1) + '%';
const pp  = v => '+' + (v*100).toFixed(1) + ' pp';

function Slider({label, value, min, max, step, fmt, onChange, hint}) {
  return (
    <div style={{marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
        <label style={{fontSize:11,color:"#64748B",fontFamily:"'DM Mono',monospace",letterSpacing:"0.5px"}}>{label}</label>
        <span style={{fontSize:12,fontWeight:700,color:"#F1F5F9",fontFamily:"'DM Mono',monospace"}}>{fmt(value)}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(Number(e.target.value))}/>
      {hint && <div style={{fontSize:10.5,color:"#334155",marginTop:4}}>{hint}</div>}
    </div>
  );
}

function IntradayChart({calls, req, base, redist, intervals}) {
  const W=560, H=200, PL=34, PR=8, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const maxAgents=Math.max(...req,...base,...redist,1);
  const maxCalls=Math.max(...calls,1);
  const x=i=>PL+(i+0.5)*(iw/intervals);
  const yA=v=>PT+ih-(v/maxAgents)*ih;
  const bw=(iw/intervals)*0.62;
  const line=arr=>arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+yA(v).toFixed(1)).join(' ');
  return (
    <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:"auto",display:"block"}}>
      {[0,0.5,1].map(f=>{const y=PT+ih-f*ih;return(
        <g key={f}>
          <line x1={PL} y1={y} x2={W-PR} y2={y} stroke="#1E293B" strokeWidth="1"/>
          <text x={PL-6} y={y+3} textAnchor="end" fill="#334155" fontSize="8" fontFamily="'DM Mono',monospace">{Math.round(maxAgents*f)}</text>
        </g>);})}
      {calls.map((c,i)=>(
        <rect key={i} x={x(i)-bw/2} y={PT+ih-(c/maxCalls)*ih*0.9} width={bw} height={(c/maxCalls)*ih*0.9} fill="#1E3A5F" opacity="0.5" rx="1"/>
      ))}
      <path d={line(req)} fill="none" stroke="#F87171" strokeWidth="2" strokeDasharray="4 3"/>
      <path d={line(base)} fill="none" stroke="#64748B" strokeWidth="2"/>
      <path d={line(redist)} fill="none" stroke="#22C55E" strokeWidth="2.5"/>
      {[0,4,8,12,15].map(i=>(
        <text key={i} x={x(i)} y={H-8} textAnchor="middle" fill="#334155" fontSize="8" fontFamily="'DM Mono',monospace">{hhmm(i)}</text>
      ))}
    </svg>
  );
}

function Legend() {
  const items=[["#1E3A5F","Call volume","rect"],["#F87171","Required","dash"],["#64748B","Current schedule","line"],["#22C55E","Redistributed","line"]];
  return (
    <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:8}}>
      {items.map(function(it){
        var c=it[0], l=it[1], t=it[2];
        return (
          <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{width:14,height:t==="rect"?8:0,borderTop:t!=="rect"?("2px "+(t==="dash"?"dashed":"solid")+" "+c):"none",background:t==="rect"?c:"none",opacity:t==="rect"?0.6:1,display:"inline-block"}}/>
            <span style={{fontSize:10,color:"#475569",fontFamily:"'DM Mono',monospace"}}>{l}</span>
          </div>
        );
      })}
    </div>
  );
}

function LeverRow({lever, maxDelta}) {
  const w = maxDelta>0 ? Math.min(100,(lever.delta/maxDelta)*100) : 0;
  const top = lever.rank===1 && lever.delta>0.0005;
  return (
    <div style={{marginBottom:15,padding:top?"13px 15px":"0",background:top?"#0D1A0D":"transparent",borderRadius:top?8:0,border:top?"1px solid #14532D":"none"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:7}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:2,flexWrap:"wrap"}}>
            <span style={{fontSize:10,fontWeight:700,color:top?"#E53E3E":"#334155",fontFamily:"'DM Mono',monospace"}}>#{lever.rank}</span>
            <span style={{fontSize:12.5,fontWeight:top?700:500,color:top?"#F1F5F9":"#94A3B8"}}>{lever.name}</span>
            {top && <span style={{fontSize:8.5,background:"#E53E3E",color:"#fff",padding:"2px 6px",borderRadius:3,fontFamily:"'DM Mono',monospace",letterSpacing:"1px"}}>TOP LEVER</span>}
          </div>
          <div style={{fontSize:10.5,color:"#475569",paddingLeft:20,lineHeight:1.4}}>{lever.desc}</div>
          <div style={{fontSize:9.5,color:"#334155",paddingLeft:20,marginTop:2,fontFamily:"'DM Mono',monospace"}}>{lever.note}</div>
        </div>
        <div style={{textAlign:"right",marginLeft:12,flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:800,color:lever.delta>0.0005?lever.color:"#475569"}}>{pp(lever.delta)}</div>
          <div style={{fontSize:9.5,color:lever.costColor,fontFamily:"'DM Mono',monospace"}}>{lever.cost}</div>
        </div>
      </div>
      <div style={{height:6,background:"#1E293B",borderRadius:3,overflow:"hidden"}}>
        <div style={{width:w+"%",height:"100%",background:lever.delta>0.0005?lever.color:"#1E293B",borderRadius:3,transition:"width .45s ease"}}/>
      </div>
    </div>
  );
}

function App() {
  const [volume,setVolume]=useState(1200);
  const [aht,setAht]=useState(240);
  const [shrinkage,setShrinkage]=useState(0.34);
  const [scheduledFTEs,setFtes]=useState(19);
  const [peakFactor,setPeak]=useState(1.0);
  const [slTarget,setSlTarget]=useState(0.80);
  const [ahtCut,setAhtCut]=useState(0.08);
  const [headAdd,setHeadAdd]=useState(0.10);
  const [shrCut,setShrCut]=useState(0.05);
  const [adv,setAdv]=useState(false);
  const [asm,setAsm]=useState(false);

  const r = useMemo(function(){
    return analyze({volume:volume,aht:aht,shrinkage:shrinkage,scheduledFTEs:scheduledFTEs,
      slTarget:slTarget,answerSec:20,maxOcc:0.90,intervals:16,peakFactor:peakFactor,
      ahtCut:ahtCut,headAdd:headAdd,shrCut:shrCut});
  },[volume,aht,shrinkage,scheduledFTEs,slTarget,peakFactor,ahtCut,headAdd,shrCut]);

  const maxDelta=Math.max.apply(null,r.levers.map(function(l){return l.delta;}).concat([0.0001]));
  const gap=scheduledFTEs-r.reqFTEs;
  const healthy=r.baselineSL>=slTarget;
  const redistHelps=r.levers.some(function(l){return l.name==='Schedule Redistribution' && l.delta>0.005;});
  const allFlat=r.levers.every(function(l){return l.delta<0.0005;});
  const atCeiling=allFlat && r.baselineSL>=0.999;
  const collapsed=allFlat && r.baselineSL<slTarget;
  const stats=[["DELIVERED SL",pct(r.baselineSL),healthy?"#22C55E":"#EF4444"],
               ["FTEs NEEDED",String(r.reqFTEs),"#F1F5F9"],
               ["GAP",(gap>=0?"+":"")+gap,gap>=0?"#22C55E":"#EF4444"]];

  return (
    <div>
      <div className="hpad" style={{background:"linear-gradient(135deg,#0F172A 0%,#1A0505 100%)",borderBottom:"1px solid #1E293B",padding:"30px 40px 26px"}}>
        <div style={{maxWidth:1080,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:11}}>
            <div style={{background:"#E53E3E",color:"#fff",fontSize:9,fontWeight:700,letterSpacing:"2px",padding:"4px 10px",borderRadius:3,fontFamily:"'DM Mono',monospace"}}>INTERVAL-LEVEL</div>
            <div style={{fontSize:10,color:"#475569",letterSpacing:"2px",fontFamily:"'DM Mono',monospace"}}>WFM DECISION LAB · SEAN CODNER</div>
          </div>
          <h1 style={{fontSize:28,fontWeight:700,letterSpacing:"-0.5px",marginBottom:8}}>Which lever actually moves your service level?</h1>
          <p style={{fontSize:12.5,color:"#64748B",maxWidth:660,lineHeight:1.6}}>
            Four standalone WFM levers, modeled interval by interval with Erlang C across a simulated day.
            Redistribution holds total productive agent-hours constant — it moves existing staff between
            intervals rather than adding any. Each lever is applied independently at its stated magnitude.
          </p>
        </div>
      </div>

      <div className="pad grid2" style={{maxWidth:1080,margin:"0 auto",padding:"26px 40px 60px",display:"grid",gridTemplateColumns:"1fr 1.15fr",gap:22}}>
        <div>
          <div className="card" style={{padding:"22px",marginBottom:14}}>
            <div className="lbl" style={{marginBottom:18}}>SCENARIO INPUTS</div>
            <Slider label="DAILY CALL VOLUME" value={volume} min={100} max={8000} step={50}
              fmt={function(v){return v.toLocaleString()+" calls";}} onChange={setVolume} hint="Calls offered across an 8-hour day, including abandons where available"/>
            <Slider label="AVERAGE HANDLE TIME" value={aht} min={60} max={720} step={10}
              fmt={function(v){return v+"s  ("+(v/60).toFixed(1)+" min)";}} onChange={setAht} hint="Talk time + after-call work"/>
            <Slider label="SHRINKAGE RATE" value={shrinkage} min={0.10} max={0.55} step={0.01}
              fmt={pct} onChange={setShrinkage} hint="Breaks, training, meetings, absence — example planning range 30–40%"/>
            <Slider label="SCHEDULED FTEs" value={scheduledFTEs} min={3} max={300} step={1}
              fmt={function(v){return v+" FTEs";}} onChange={setFtes} hint="Total FTEs on the schedule for the modeled day"/>
            <Slider label="DEMAND PEAKINESS" value={peakFactor} min={0} max={2} step={0.1}
              fmt={function(v){return v===0?"flat day":v.toFixed(1)+"×";}} onChange={setPeak}
              hint="0 = perfectly flat demand · 1.0 = typical double-hump"/>

            <button onClick={function(){setAdv(!adv);}} style={{background:"none",border:"1px solid #1E293B",borderRadius:6,padding:"7px 13px",fontSize:10.5,color:"#475569",cursor:"pointer",fontFamily:"'DM Mono',monospace",letterSpacing:"1px",width:"100%",textAlign:"left"}}>
              {adv?"▲  HIDE LEVER SETTINGS":"▼  LEVER SETTINGS & TARGET"}
            </button>
            {adv && (
              <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid #1E293B"}}>
                <Slider label="SERVICE LEVEL TARGET" value={slTarget} min={0.60} max={0.95} step={0.01}
                  fmt={pct} onChange={setSlTarget} hint="Answered within 20s — industry standard 80/20"/>
                <Slider label="AHT REDUCTION LEVER" value={ahtCut} min={0.02} max={0.20} step={0.01}
                  fmt={function(v){return "−"+(v*100).toFixed(0)+"%";}} onChange={setAhtCut}
                  hint="Adjust to test a realistic sustained AHT reduction"/>
                <Slider label="HEADCOUNT ADD LEVER" value={headAdd} min={0.02} max={0.40} step={0.01}
                  fmt={function(v){return "+"+(v*100).toFixed(0)+"%";}} onChange={setHeadAdd} hint="Extra FTEs added to the schedule"/>
                <Slider label="SHRINKAGE REDUCTION LEVER" value={shrCut} min={0.01} max={0.20} step={0.01}
                  fmt={function(v){return "−"+(v*100).toFixed(0)+" pts";}} onChange={setShrCut} hint="Reduction in controllable shrinkage"/>
              </div>
            )}
          </div>

          <div className="card" style={{padding:"18px 22px"}}>
            <div className="lbl" style={{marginBottom:14}}>THE AGGREGATE TRAP</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9,marginBottom:12}}>
              {stats.map(function(s){
                return (
                  <div key={s[0]} style={{background:"#0F172A",borderRadius:8,padding:"11px 12px",border:"1px solid #1E293B"}}>
                    <div style={{fontSize:9,color:"#475569",fontFamily:"'DM Mono',monospace",marginBottom:5,letterSpacing:"1px"}}>{s[0]}</div>
                    <div style={{fontSize:18,fontWeight:800,color:s[2]}}>{s[1]}</div>
                  </div>
                );
              })}
            </div>
            <div style={{fontSize:11.5,lineHeight:1.55,color:"#94A3B8",background:"#0F172A",border:"1px solid #1E293B",borderRadius:6,padding:"10px 13px"}}>
              <strong style={{color:"#F1F5F9"}}>{r.under} of {r.intervals} intervals understaffed</strong>
              {" · "}{r.over} overstaffed{" · "}{r.on} on target.
              {redistHelps
                ? (gap>=0
                    ? " Total staffing is sufficient for the day, but it is not distributed across the intervals where demand lands."
                    : " Staffing is short in total and misdistributed. Redistribution recovers part of this; the rest needs capacity.")
                : (gap>=0
                    ? " Staffing is already close to the best distribution this model can find, so redistribution has little left to recover."
                    : " Staffing is short in total. Redistribution has little left to recover — this gap needs capacity, not reallocation.")}
            </div>
          </div>
        </div>

        <div>
          <div className="card" style={{padding:"20px 22px",marginBottom:14}}>
            <div className="lbl" style={{marginBottom:10}}>INTRADAY COVERAGE</div>
            <div style={{fontSize:10.5,color:"#94A3B8",background:"#1A1505",border:"1px solid #78350F",borderRadius:6,padding:"8px 11px",marginBottom:12,lineHeight:1.5}}>
              <strong style={{color:"#FCD34D"}}>Illustrative scenario.</strong> Interval demand is generated from the
              selected peakiness profile, and baseline staffing is distributed approximately evenly across the day.
              This is a what-if simulator, not an analysis of an actual forecast or schedule.
            </div>
            <IntradayChart calls={r.calls} req={r.reqAgentsPer} base={r.baseAgents} redist={r.redistAgents} intervals={r.intervals}/>
            <Legend/>
            <div style={{fontSize:10.5,color:"#334155",marginTop:10,lineHeight:1.5}}>
              Daily volume is distributed across a simulated intraday demand curve. The red dashed line is the
              staffing required under that assumed pattern; the grey line is the evenly distributed baseline
              coverage. Redistribution (green) reshapes the same {r.totalAgentSlots} half-hour agent intervals
              ({(r.totalAgentSlots/2).toFixed(1)} productive agent-hours) to follow it.
            </div>
          </div>

          <div className="card" style={{padding:"20px 22px",marginBottom:14}}>
            <div className="lbl" style={{marginBottom:4}}>STANDALONE LEVERS — RANKED</div>
            <div style={{fontSize:10.5,color:"#475569",marginBottom:14}}>Each lever is applied independently against the same baseline.</div>
            {atCeiling && (
              <div style={{fontSize:11,color:"#86EFAC",background:"#0D1A0D",border:"1px solid #14532D",borderRadius:6,padding:"9px 12px",marginBottom:14,lineHeight:1.5}}>
                <strong>Every lever reads 0.0 pp because this scenario already delivers ~100% service level.</strong>{" "}
                There is no shortfall left to recover. Lower Scheduled FTEs, raise Daily Call Volume, or raise
                Average Handle Time to model an operation under pressure.
              </div>
            )}
            {collapsed && (
              <div style={{fontSize:11,color:"#FCA5A5",background:"#1A0505",border:"1px solid #7F1D1D",borderRadius:6,padding:"9px 12px",marginBottom:14,lineHeight:1.5}}>
                <strong>Every lever reads ~0.0 pp because demand exceeds capacity in every interval.</strong>{" "}
                With staffing this far below requirement the queue never stabilizes, so incremental levers
                cannot move service level — this scenario needs materially more capacity, not reallocation.
                Raise Scheduled FTEs toward the {r.reqFTEs} FTEs required to see the levers separate.
              </div>
            )}
            {r.levers.map(function(l){return <LeverRow key={l.name} lever={l} maxDelta={maxDelta}/>;})}
          </div>

          <div className="card" style={{padding:"18px 22px",marginBottom:14,borderColor:"#1E3A5F"}}>
            <div style={{fontSize:10,letterSpacing:"2px",color:"#38BDF8",fontFamily:"'DM Mono',monospace",fontWeight:700,marginBottom:4}}>COMPOUND SCENARIO</div>
            <div style={{fontSize:10.5,color:"#475569",marginBottom:12}}>Two levers together — shown separately because it is not a like-for-like comparison against a single intervention.</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12.5,fontWeight:700,color:"#F1F5F9",marginBottom:2}}>{r.combined.name}</div>
                <div style={{fontSize:10.5,color:"#475569",lineHeight:1.4}}>{r.combined.desc}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:16,fontWeight:800,color:"#38BDF8"}}>{pp(r.combined.delta)}</div>
                <div style={{fontSize:9.5,color:"#F59E0B",fontFamily:"'DM Mono',monospace"}}>{r.combined.cost}</div>
              </div>
            </div>
            <div style={{height:6,background:"#1E293B",borderRadius:3,overflow:"hidden",marginTop:9}}>
              <div style={{width:Math.min(100,(r.combined.delta/Math.max(maxDelta,r.combined.delta))*100)+"%",height:"100%",background:"#38BDF8",borderRadius:3,transition:"width .45s ease"}}/>
            </div>
            <div style={{fontSize:11,color:"#94A3B8",marginTop:10,lineHeight:1.5}}>
              Reaches <strong style={{color:"#F1F5F9"}}>{pct(r.combined.sl)}</strong> modeled service level
              {r.combined.sl>=slTarget ? " — clearing the "+pct(slTarget)+" target." : " — still short of the "+pct(slTarget)+" target."}
            </div>
          </div>

          <div className="card" style={{padding:"18px 22px"}}>
            <div className="lbl" style={{marginBottom:12}}>COMPARISON</div>
            <table>
              <thead><tr style={{borderBottom:"1px solid #1E293B"}}>
                {["#","Lever","SL Lift (pp)","Resulting SL","Implementation consideration"].map(function(h){
                  return <th key={h} style={{textAlign:"left",padding:"5px 7px",color:"#334155",fontWeight:600,fontFamily:"'DM Mono',monospace",fontSize:9.5,letterSpacing:"1px"}}>{h}</th>;})}
              </tr></thead>
              <tbody>
                {r.levers.map(function(l,i){
                  return (
                    <tr key={l.name} style={{borderBottom:i<r.levers.length-1?"1px solid #0F172A":"none",background:(l.rank===1&&l.delta>0.0005)?"#0D1A0D":"transparent"}}>
                      <td style={{padding:"8px 7px",color:l.rank===1?"#E53E3E":"#334155",fontFamily:"'DM Mono',monospace",fontSize:10.5,fontWeight:700}}>#{l.rank}</td>
                      <td style={{padding:"8px 7px",color:l.rank===1?"#F1F5F9":"#94A3B8",fontWeight:l.rank===1?700:400,fontSize:11.5}}>{l.name}</td>
                      <td style={{padding:"8px 7px",fontWeight:700,color:l.delta>0.0005?l.color:"#475569",fontFamily:"'DM Mono',monospace",fontSize:11.5}}>{pp(l.delta)}</td>
                      <td style={{padding:"8px 7px",color:"#64748B",fontFamily:"'DM Mono',monospace",fontSize:11.5}}>{pct(l.sl)}</td>
                      <td style={{padding:"8px 7px",color:l.costColor,fontSize:10.5}}>{l.cost}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{marginTop:12,paddingTop:11,borderTop:"1px solid #1E293B",fontSize:10.5,color:"#334155",lineHeight:1.55}}>
              Erlang C per 30-minute interval across a 16-interval day; aggregate service level is
              call-weighted. Redistribution reshapes the schedule to the interval requirement curve while
              holding total productive agent-hours fixed, and is floored so no interval is stripped to feed
              the peaks. Scenario magnitudes are adjustable under Lever Settings and should not be interpreted as
              equivalent levels of cost or effort. Implementation considerations are qualitative notes, not
              model outputs — actual cost and difficulty depend on the operation.
              <div style={{marginTop:9}}>
                <button onClick={function(){setAsm(!asm);}} style={{background:"none",border:"1px solid #1E293B",borderRadius:5,padding:"5px 10px",fontSize:9.5,color:"#475569",cursor:"pointer",fontFamily:"'DM Mono',monospace",letterSpacing:"1px"}}>
                  {asm?"▲ HIDE MODEL ASSUMPTIONS":"▼ MODEL ASSUMPTIONS"}
                </button>
              </div>
              {asm && (
                <div style={{marginTop:9,paddingTop:9,borderTop:"1px solid #1E293B",color:"#475569",lineHeight:1.6}}>
                  Poisson call arrivals · exponential handle times · no abandonment (Erlang C, not A) ·
                  a single homogeneous agent skill · no transfers or retries · steady state within each
                  interval · all redistributed staffing assumed operationally movable · no shift-length,
                  labor-rule, skill or break-placement constraints. Interval demand and the baseline
                  schedule are both generated by the model, not imported from an actual forecast.
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      <div style={{borderTop:"1px solid #1E293B",padding:"15px 40px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:10.5,color:"#334155",fontFamily:"'DM Mono',monospace"}}>Sean Codner · WFM Decision Lab</div>
        <a href="https://github.com/SEANSKIDATA/WFM-Decision-Lab" target="_blank" rel="noopener noreferrer" style={{fontSize:10.5,color:"#475569",fontFamily:"'DM Mono',monospace",textDecoration:"none"}}>github.com/SEANSKIDATA/WFM-Decision-Lab →</a>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
